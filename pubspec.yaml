name: camby
description: "Camby · Android 端 Emby 播放器（Yamby 的能力 + EplayerX 的页面 + 数据总结）"
publish_to: 'none'
version: 2.0.69+269

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # 在线字幕：迅雷接口返回 GBK 编码字幕，项目自带的解码器不认 GBK
  gbk_codec: ^0.4.0
  # Lara 翻译：HMAC-SHA256 签名鉴权 + MD5 校验需要 crypto
  crypto: ^3.0.6
  # 导出字幕时弹系统分享面板（可发给 NAS / 文件管理器）
  share_plus: ^13.3.1
  video_player: ^2.11.0
  http: ^1.4.0
  shared_preferences: ^2.5.6
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  volume_controller: ^3.7.1
  screen_brightness: ^2.1.11
  inspire_blur: ^0.4.1
  cached_network_image: ^3.4.1
  # v2.0.64：图片淡入前需要同步判断磁盘缓存是否命中（命中则 0ms 直出）
  flutter_cache_manager: ^3.4.6
  path_provider: ^2.1.5
  package_info_plus: ^10.2.2
  wakelock_plus: ^1.8.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/FangSong.ttf
  fonts:
    - family: FangSong
      fonts:
        - asset: assets/fonts/FangSong.ttf
